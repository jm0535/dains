name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.R_LIBS_USER }}
            ~/.cache/R/renv
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/install_packages.R') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          # Use renv if lockfile is present
          use-renv: true

      - name: Audit book contracts
        run: python3 scripts/book_audit.py

      - name: Run chapter tests
        if: hashFiles('tests/test-chapters.R') != ''
        run: |
          Rscript tests/test-chapters.R

      - name: Render Quarto book (timed)
        run: |
          start=$(date +%s)
          quarto render
          end=$(date +%s)
          elapsed=$((end - start))
          echo "render_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "Render took ${elapsed}s"
          # Soft regression gate: warn if render exceeds 25 minutes (1500s).
          # Tune this ceiling as the book grows. Hard-fail only on egregious
          # regressions (>40 min) so transient runner slowdowns don't block.
          if [ "$elapsed" -gt 2400 ]; then
            echo "::error::Render took ${elapsed}s, exceeds 40min hard limit"
            exit 1
          elif [ "$elapsed" -gt 1500 ]; then
            echo "::warning::Render took ${elapsed}s, exceeds 25min soft limit; investigate slowdown"
          fi
        id: render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    # Pinned alongside the build job (ubuntu-latest migrates to Ubuntu 26
    # on 2026-10-19).
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
